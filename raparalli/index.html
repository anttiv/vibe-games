<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raparalli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --hud-fg:#fff6dc; --hud-shadow:#2a1a0a; --accent:#ffd23f; --ghost:#9fe0ff; --good:#7ee07e; --bad:#ff7a66;
  --panel-bg:rgba(42,26,10,.86); --panel-fg:#fff6dc; --panel-bd:#ffd23f;
  --btn-bg:rgba(30,20,10,.5); --btn-bd:rgba(255,246,220,.8); --btn-on:rgba(255,210,63,.65); --plate:rgba(30,20,10,.45);
  --page-bg:#8f9aa1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --panel-bg:rgba(16,10,4,.9); --page-bg:#1a140c; color-scheme:dark; }
}
:root[data-theme="dark"]{ --panel-bg:rgba(16,10,4,.9); --page-bg:#1a140c; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;overflow:hidden;background:var(--page-bg);}
body{font-family:"Press Start 2P","Courier New",ui-monospace,monospace;color:var(--hud-fg);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated;}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 14px) 0 calc(env(safe-area-inset-left,0px) + 14px);
  font-size:12px;line-height:2;text-shadow:2px 2px 0 var(--hud-shadow);}
.hud .r{text-align:right}
.hud>div{background:var(--plate);padding:4px 8px}
.ic{width:1em;height:1em;vertical-align:-0.1em;margin-right:6px}
.k{color:var(--accent)}
.g{color:var(--ghost)}
#speed{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  font-size:24px;text-shadow:3px 3px 0 var(--hud-shadow);pointer-events:none;white-space:nowrap;background:var(--plate);padding:6px 12px}
#speed small{font-size:10px;color:var(--accent)}
#msg{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);font-size:44px;color:var(--accent);
  text-shadow:4px 4px 0 var(--hud-shadow),-2px -2px 0 var(--hud-shadow),2px -2px 0 var(--hud-shadow),-2px 2px 0 var(--hud-shadow);pointer-events:none;text-align:center;white-space:nowrap}
#msg small{display:block;font-size:14px;color:var(--hud-fg);margin-top:14px}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,12,4,.35)}
.cards{display:flex;gap:12px;justify-content:center;margin:0 0 14px;flex-wrap:wrap}
.card{font:inherit;font-size:9px;color:var(--panel-fg);padding:0;background:rgba(0,0,0,.25);border:3px solid var(--btn-bd);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.card img{display:block;width:128px;height:80px;image-rendering:crisp-edges;image-rendering:pixelated}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.card .cbest{padding:5px 0 6px;display:flex;align-items:center}
.card .vname{display:flex;align-items:center;justify-content:center;width:128px;height:80px}
.gobtn .ic,.opt .ic{width:20px;height:20px;margin:0}
.keys .kc{display:inline-block;border:2px solid var(--btn-bd);padding:3px 6px;margin:0 2px 0 10px;font-size:9px}
.keys .ic{color:var(--accent);margin:0 0 0 4px}
.pick{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 12px;flex-wrap:wrap;font-size:10px}
.pick .k{min-width:96px;text-align:right}
.opts{display:flex;gap:8px}
.opt{font:inherit;font-size:10px;padding:9px 12px;background:transparent;color:var(--panel-fg);border:2px solid var(--btn-bd);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--hud-shadow);border-color:var(--accent)}
.gobtn{font:inherit;font-size:14px;padding:12px 28px;background:var(--accent);color:var(--hud-shadow);border:0;box-shadow:4px 4px 0 rgba(0,0,0,.45);cursor:pointer;margin:6px 0 16px}
.gobtn:disabled{opacity:.6;cursor:progress}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
.panel button:focus-visible{outline:3px solid var(--panel-fg);outline-offset:2px}
.panel{background:var(--panel-bg);color:var(--panel-fg);padding:28px 26px;max-width:min(500px,88vw);
  border:4px solid var(--panel-bd);box-shadow:8px 8px 0 rgba(0,0,0,.45);text-align:center;max-height:calc(100% - 24px);overflow:auto;box-sizing:border-box}
h1{font-size:26px;margin:0 0 10px;color:var(--accent);line-height:1.3;text-shadow:3px 3px 0 var(--hud-shadow)}
.sub{font-size:9px;line-height:1.8;opacity:.85;margin:0 0 22px}
.keys{font-size:9px;line-height:2.3;text-align:left;display:inline-block;margin:0 0 18px}
.best{font-size:10px;margin:0 0 18px}
.go{font-size:11px;color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.go{animation:none}}
#mm{position:fixed;box-shadow:0 0 0 2px rgba(30,20,10,.5);left:calc(env(safe-area-inset-left,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 12px);
  width:128px;height:128px;image-rendering:crisp-edges;image-rendering:pixelated;pointer-events:none;
  background:rgba(42,26,10,.5);border:2px solid rgba(255,246,220,.45)}
.hud .l{margin-top:140px}
.touch,.tbar{display:none}
.touch{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);gap:12px}
#tl{left:calc(env(safe-area-inset-left,0px) + 14px)}
#tr{right:calc(env(safe-area-inset-right,0px) + 14px)}
#th{right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 102px)}
.tb.sm{width:60px;height:60px}
.tb .ic{width:26px;height:26px;margin:0}
.card.tod{width:56px;height:40px;align-items:center;justify-content:center;color:var(--accent)}
.card.tod .ic{width:24px;height:24px;margin:0}
.tb{width:74px;height:74px;border-radius:16px;background:var(--btn-bg);border:2px solid var(--btn-bd);color:var(--hud-fg);
  font:inherit;font-size:16px;display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
.tb.on{background:var(--btn-on)}
.pad{width:180px;height:74px;border-radius:16px;background:var(--btn-bg);border:2px solid var(--btn-bd);position:relative;touch-action:none}
.padTrack{position:absolute;left:18px;right:18px;top:50%;height:4px;margin-top:-2px;background:var(--btn-bd);opacity:.6}
.pad.v{width:74px;height:180px}
.pad.v .padTrack{left:50%;right:auto;top:18px;bottom:18px;width:4px;height:auto;margin:0 0 0 -2px}
.knob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:var(--btn-on);border:2px solid var(--btn-bd);transform:translate(-50%,-50%);pointer-events:none}
#split{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);font-size:18px;padding:6px 12px;
  background:var(--plate);color:var(--hud-fg);text-shadow:2px 2px 0 var(--hud-shadow);pointer-events:none;visibility:hidden}
#split.good{color:var(--good)} #split.bad{color:var(--bad)}
.tbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);gap:10px}
.ts{width:44px;height:36px;border-radius:10px;background:var(--btn-bg);border:2px solid var(--btn-bd);color:var(--hud-fg);font:inherit;font-size:12px;padding:0}
@media (pointer:coarse){
  .touch,.tbar{display:flex}
  #mm{width:96px;height:96px}
  .card img,.card .vname{width:88px;height:55px}
  .cards{gap:8px}
  .panel{padding:20px 14px}
  h1{font-size:20px}
  .hud .l{margin-top:106px}
  .desk{display:none}
  #speed{bottom:calc(env(safe-area-inset-bottom,0px) + 104px);font-size:18px}
  .hud{font-size:9px}
  #msg{font-size:30px}
}
/* landscape phones: the pedal clusters sit at the far edges, so the speedometer fits between them at the bottom
   instead of the portrait lift, which put it over the vehicle */
@media (pointer:coarse) and (orientation:landscape){
  #speed{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
}
@media (pointer:coarse) and (max-width:390px){ .pad:not(.v){width:150px} }   /* pad + pedals must fit 360 px phones */
@media (pointer:fine){ .mob{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="mm" width="64" height="64" aria-hidden="true"></canvas>

<div class="hud">
  <div class="l"><span class="k" data-ic="flag" title="Kierros"></span><span id="lap">1</span><br><span class="k" data-ic="watch" title="Aika"></span><span id="time">0:00.00</span></div>
  <div class="r"><span class="k" data-ic="last" title="Edellinen kierros"></span><span id="last">-:--.--</span><br><span class="g" data-ic="ghost" title="Paras kierros"></span><span id="best">-:--.--</span></div>
</div>
<div id="speed"><span id="spd">0</span> <small>km/h</small></div>
<div id="msg"></div>
<div id="split" role="status" aria-live="polite"></div>

<div class="tbar">
  <button class="ts" id="bReset" aria-label="Palauta auto radalle">⟲</button>
  <button class="ts" id="bPause" aria-label="Tauko">II</button>
</div>
<div class="touch" id="tl">
  <div class="pad" id="steerPad" role="slider" aria-label="Ohjaus" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0">
    <div class="padTrack"></div><div class="knob" id="steerKnob"></div>
  </div>
</div>
<div class="touch" id="th">
  <button class="tb sm" data-k="hb" aria-label="Käsijarru"><span data-ic="hb"></span></button>
</div>
<div class="touch" id="tr">
  <button class="tb" data-k="down" aria-label="Jarru"><svg width="40" height="34" viewBox="0 0 40 34" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="5" width="34" height="24" rx="5" fill="currentColor" fill-opacity=".18"/><path d="M10 12h20M10 17h20M10 22h20" stroke-linecap="round"/></svg></button>
  <button class="tb" data-k="up" aria-label="Kaasu"><svg width="26" height="46" viewBox="0 0 26 46" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="3" width="20" height="40" rx="5" fill="currentColor" fill-opacity=".18"/><path d="M8 12h10M8 18h10M8 24h10M8 30h10M8 36h10" stroke-linecap="round"/></svg></button>
</div>

<div id="overlay">
  <div class="panel" id="menu">
    <h1>Raparalli</h1>
    <div class="cards" id="trackOpts" role="group" aria-label="Rata"></div>
    <div class="cards" id="vehOpts" role="group" aria-label="Kulkupeli"></div>
    <div class="cards" id="timeOpts" role="group" aria-label="Vuorokaudenaika"></div>
    <div class="cards mob" id="steerOpts" role="group" aria-label="Ohjaimen asento"></div>
    <button class="gobtn" id="goBtn" aria-label="Aja"><span data-ic="play"></span></button>
    <div class="keys desk">
      <span class="kc">←↑→↓</span><span class="kc">␣</span><span data-ic="hb" title="Käsijarru"></span>
      <span class="kc">R</span><span data-ic="last" title="Takaisin radalle"></span><br>
      <span class="kc">P</span><span data-ic="grid" title="Pikselit"></span>
      <span class="kc">M</span><span data-ic="note" title="Ääni"></span>
      <span class="kc">Esc</span><span data-ic="pause" title="Tauko"></span>
    </div>
  </div>
  <div class="panel" id="pausePanel" style="display:none">
    <div class="row"><button class="gobtn" id="resumeBtn" aria-label="Jatka"><span data-ic="play"></span></button><button class="opt" id="menuBtn" aria-label="Valikkoon"><span data-ic="menu"></span></button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    for (const f of player.fronts) f.rotation.y = car.steer * 0.45;
    if (VD.wheelR) for (const s2 of player.spins) s2.rotation.x += car.vf * dt / VD.wheelR;
    shadow.position.set(car.x, H(car.x, car.z), car.z);
    shadow.quaternion.copy(basisQuat(car.h, groundNormal(car.x, car.z, _n3), _q));
    shadow.visible = car.depth < 0.05;
    const gp = state === "race" ? ghostPose(race) : null;
    ghostCar.root.visible = !!gp;
    if (gp) {
      const { i, a, g } = gp, o = i * 7, p = o + 7;
      ghostCar.root.position.set(lerp(g[o], g[p], a), lerp(g[o + 1], g[p + 1], a), lerp(g[o + 2], g[p + 2], a));
      _qa.set(g[o + 3], g[o + 4], g[o + 5], g[o + 6]);
      _qb.set(g[p + 3], g[p + 4], g[p + 5], g[p + 6]);
      ghostCar.root.quaternion.copy(_qa.slerp(_qb, a));
    }
    const inT = TUNNELS.length && (inTunnel(car.idx, car.d) || inTunnel((car.idx + 8) % N, car.d));
    tb += ((inT ? 1 : 0) - tb) * Math.min(1, dt * 3);
    S.hemi.intensity = L.hemi[2] * (1 - 0.6 * tb);
    S.sun.intensity = L.sun[1] * (1 - 0.7 * tb);
    if (player.lamp) player.lamp.visible = L.headlights || tb > 0.3;
    const camPos = updateCamRig(rig, car, VD, dt, { menu: state === "menu", frozen: camFrozen, tb });
    const bx = Math.sin(rig.yaw), bz = Math.cos(rig.yaw);
    camera2.position.copy(camPos);
    if (camShake > 0) {
      camera2.position.x += (Math.random() - 0.5) * camShake;
      camera2.position.y += (Math.random() - 0.5) * camShake;
      camShake = Math.max(0, camShake - dt * 1.2);
    }
    camera2.lookAt(car.x + bx * 4, car.y + 1, car.z + bz * 4);
    if (state !== "paused") {
      updateWeather(S, camera2, dt);
      updateSky(S, camera2, dt);
    }
    renderer.render(S.scene, camera2);
    drawMinimap(car, gp ? ghostCar.root.position : null);
    if (msgT > 0) {
      msgT -= dt;
      if (msgT <= 0) ui.msg.innerHTML = "";
    }
    if (splitT > 0) {
      splitT -= dt;
      if (splitT <= 0) $("split").style.visibility = "hidden";
    }
    ui.lap.textContent = race.lap;
    ui.time.textContent = fmt(state === "menu" ? 0 : race.clock - race.lapStart);
    ui.last.textContent = fmt(race.last);
    ui.best.textContent = fmt(race.best);
    ui.spd.textContent = Math.round(Math.abs(car.vf) * 3.6);
    updateAudio({ car, state, thr: input.up, P, VD, theme: CFG2.theme, weather: CFG2.weather, tunnel: tb });
  }
  requestAnimationFrame(frame);
})();

</script>
