<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kesän urheilupäivä 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --board:#13204a; --board-edge:#2b3f86; --led:#ffd23f;
  --ink:#f4f6ff; --bad:#ff4d5e; --good:#4dff88; --page:#13204a;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--board:#0a1230;--board-edge:#24357a;--page:#0a1230;color-scheme:dark;}}
:root[data-theme="dark"]{--board:#0a1230;--board-edge:#24357a;--page:#0a1230;color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Press Start 2P",ui-monospace,"Courier New",monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:relative;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.board{background:var(--board);border:3px solid var(--board-edge);box-shadow:0 4px 0 rgba(0,0,0,.35);color:var(--led);border-radius:6px}
#hud{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none;transition:opacity .2s}
#hud.off{opacity:0}
#quit{pointer-events:auto;font-size:9px;padding:8px 10px;background:var(--board);color:var(--led);border:3px solid var(--board-edge);border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.35);align-self:flex-start;white-space:nowrap}
#quit:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#quit.confirm{background:var(--bad);color:#fff;border-color:#fff}
#hud.off #quit{visibility:hidden}
.row{display:flex;justify-content:space-between;gap:6px}
.pill{padding:8px 10px;font-size:10px;line-height:1.3}
#meters{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:9px}
.bar{flex:1;height:12px;background:#000;border:2px solid var(--board-edge);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4dff88,#ffd23f 60%,#ff4d5e)}
#pips{display:flex;gap:3px}
#pips span{width:10px;height:10px;background:#000;border:2px solid var(--board-edge)}
#pips span.on{background:var(--led)}
#pips span.red.on{background:var(--bad)}
#hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:12px;color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none;line-height:1.6;padding:0 12px}
#banner{position:absolute;left:50%;top:118px;transform:translateX(-50%) scale(.6);opacity:0;transition:transform .25s,opacity .25s;text-align:center;padding:14px 18px;min-width:min(86vw,320px);pointer-events:none}
#banner.show{opacity:1;transform:translateX(-50%) scale(1)}
#b1{font-size:26px;margin-bottom:10px}
#banner.foul #b1{color:var(--bad)}
#banner.good #b1{color:var(--good)}
#b2{font-size:10px;line-height:1.8;color:var(--ink);white-space:pre-line}
#b3{font-size:9px;margin-top:10px;color:var(--led);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,10,30,.55);padding:16px}
#overlay.show{display:flex}
.card{max-width:360px;width:100%;padding:22px 18px;text-align:center;color:var(--ink);max-height:100%;overflow:auto}
.card h1{font-size:18px;overflow-wrap:anywhere;line-height:1.5;margin:0 0 18px;color:var(--led);text-shadow:3px 3px 0 #b03a1e}
.card h2{font-size:18px;margin:6px 0 14px;color:var(--led)}
.steps{list-style:none;padding:0;margin:0 0 16px;text-align:left;font-size:10px;line-height:1.8}
.steps li{display:flex;gap:10px;margin-bottom:8px}
.steps b{color:var(--led);font-weight:normal}
.goals{font-size:10px;margin:0 0 6px;line-height:1.8}
.rec{font-size:9px;color:var(--led);margin:0 0 16px;line-height:1.6}
.medal{font-size:64px;line-height:1}
.list{font-size:11px;line-height:2;margin:0 0 12px}
.list .f{color:var(--bad)} .list .o{color:var(--good)}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center}
.ev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:12px;line-height:1.6;padding:14px}
.ev .ic{font-size:28px}
.ev small{display:block;font-size:8px;opacity:.75}
button{font:inherit;font-size:14px;padding:14px 26px;background:var(--led);color:#13204a;border:0;border-radius:6px;box-shadow:0 4px 0 #b08a10;cursor:pointer}
button.ghost{background:transparent;color:var(--led);box-shadow:none;font-size:10px;padding:8px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b08a10}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){#b3{animation:none}#banner{transition:none}}
#gauge{position:absolute;right:14px;top:32%;height:28%;width:18px;background:#13204a;border:3px solid #1a1a2e;display:none;pointer-events:none}
#gauge.show{display:block}
#gauge .w{position:absolute;left:0;right:0;background:#5aff8c}
#gauge .p{position:absolute;left:0;right:0;background:#ffd23f}
#gmark{position:absolute;left:-7px;right:-7px;height:5px;background:#fff;border:2px solid #1a1a2e;transform:translateY(50%)}
#gauge span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:8px;color:#fff;text-shadow:1px 1px 0 #000}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--led)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" class="off">
    <div class="row"><div class="pill board" id="att"></div><button id="quit" aria-label="Takaisin lajivalintaan">Valikko</button><div class="pill board" id="bestp"></div></div>
    <div id="meters" class="board"><span id="ml1">Vauhti</span><div class="bar"><i id="pw"></i></div><span id="ml2"></span><div id="pips"></div></div>
  </div>
  <div id="hint"></div>
  <div id="gauge"><span>Ponnista</span><div class="w" style="bottom:72%;height:28%"></div><div class="p" style="bottom:82.5%;height:7%"></div><div id="gmark"></div></div>
  <div id="banner" class="board"><div id="b1"></div><div id="b2"></div><div id="b3"></div></div>
  <div id="overlay" class="show"><div class="card board" id="card"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function boot(){
if(!window.THREE){document.getElementById('card').innerHTML='<p class="rec">3D-moottorin lataus epäonnistui. Tarkista verkkoyhteys ja lataa sivu uudelleen.</p>';return;}
(()=>{
const TAU=Math.PI*2, D2R=Math.PI/180, R2D=180/Math.PI;
const $=id=>document.getElementById(id);
const cv=$('c');
const hint=$('hint'), banner=$('banner'), overlay=$('overlay'), card=$('card'), pips=$('pips'), hud=$('hud');
const OUT='#1a1a2e';
const fi=(n,d)=>n.toFixed(d).replace('.',',');
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const wrap=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;};
function lerpPose(A,B,t){const o={};for(const k in A){const b=B[k]===undefined?A[k]:B[k];o[k]=A[k]+(b-A[k])*t;}return o;}
function seqPose(keys,u){
  if(u<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const [t0,a]=keys[i],[t1,b]=keys[i+1];if(u<=t1){const t=(u-t0)/(t1-t0);return lerpPose(a,b,t*t*(3-2*t));}}
  return keys[keys.length-1][1];
}
/* records */
const rec={hammer:0,vault:0,javelin:0,hurdles:0,archery:0};
try{Object.assign(rec,JSON.parse(localStorage.getItem('summerRecords')||'{}'));const old=parseFloat(localStorage.getItem('hammerRecord'));if(old&&!rec.hammer)rec.hammer=old;}catch(e){}
const saveRec=()=>{try{localStorage.setItem('summerRecords',JSON.stringify(rec))}catch(e){}};

/* audio */
let ac=null, noiseBuf=null;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  try{ac=new (window.AudioContext||window.webkitAudioContext)();noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){ac=null}
}
function tone(f,dur,type='square',vol=.06,when=0,to){
  if(!ac)return;const t=ac.currentTime+when;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,freq,att=.02,when=0){
  if(!ac)return;const t=ac.currentTime+when;const src=ac.createBufferSource();src.buffer=noiseBuf;src.loop=true;
  const fi=ac.createBiquadFilter();fi.type='bandpass';fi.frequency.value=freq;fi.Q.value=.8;
  const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(fi).connect(g).connect(ac.destination);src.start(t);src.stop(t+dur+.05);
}
const sfx={
  tick:f=>tone(f,.05,'square',.035),
  whoosh:()=>noise(.45,.18,1800,.03),
  thud:()=>{tone(130,.3,'sine',.35,0,45);noise(.18,.25,350,.005);},
  cheer:k=>noise(1.8,.06+.14*k,1100,.35),
  buzz:()=>{tone(110,.55,'sawtooth',.07);tone(104,.55,'sawtooth',.05);},
  fanfare:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i===5?.6:.16,'square',.06,i*.15)),
  clang:()=>{tone(900,.4,'triangle',.08,0,700);noise(.2,.15,3000,.005);},
  step:()=>noise(.05,.06,700,.005),
  plant:()=>{tone(160,.15,'square',.09,0,90);noise(.1,.15,500,.005);},
  push:()=>tone(520,.12,'square',.07,0,1040),
  clatter:()=>{[0,.08,.17,.3].forEach(w=>tone(700+Math.random()*500,.08,'triangle',.07,w));noise(.4,.1,2500,.005);},
  mat:()=>noise(.35,.25,250,.01)
};

/* shared UI */
function setHint(t){hint.textContent=t;}
function hudSetup(l1,l2,n,redMode){
  $('ml1').textContent=l1;$('ml2').textContent=l2;pips.innerHTML='';
  for(let i=0;i<n;i++){const s=document.createElement('span');if(redMode==='all'||(redMode==='last'&&i===n-1))s.className='red';pips.appendChild(s);}
  shownPips=-1;
}
let shownPips=-1;
function hudBar(v){$('pw').style.width=(clamp(v,0,1)*100)+'%';}
function hudPips(k){if(k===shownPips)return;shownPips=k;[...pips.children].forEach((p,i)=>p.classList.toggle('on',i<k));}
function hudTop(a,b){$('att').textContent=a;$('bestp').textContent=b;}
function showBanner(a,b,c,cls){$('b1').textContent=a;$('b2').textContent=b;$('b3').textContent=c;banner.className='board show '+(cls||'');}
function hideBanner(){banner.className='board';}

/* ================= 3D CORE ================= */
const V3=THREE.Vector3;
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false,powerPreference:'low-power'});
let W=1,H=1;const cams=[];
function resize(){W=cv.clientWidth||1;H=cv.clientHeight||1;renderer.setPixelRatio(Math.min(1,300/Math.min(W,H)));renderer.setSize(W,H,false);for(const c of cams){c.aspect=W/H;c.updateProjectionMatrix();}}
window.addEventListener('resize',resize);
const aspect=()=>W/H;
const fitD=(w,h)=>Math.max(w/aspect(),h)/(2*Math.tan(25*D2R));
const mats={};const mat=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));
const basic=c=>new THREE.MeshBasicMaterial({color:c});
function mesh(g,m,x=0,y=0,z=0,parent){const o=new THREE.Mesh(g,typeof m==='string'?mat(m):m);o.position.set(x,y,z);if(parent)parent.add(o);return o;}
function labelTex(text,color){
  const px=16,c=document.createElement('canvas'),g=c.getContext('2d');g.font=`${px}px "Press Start 2P", monospace`;
  const w=Math.ceil(g.measureText(text).width)+8,h=px+8;c.width=w;c.height=h;
  g.font=`${px}px "Press Start 2P", monospace`;g.textBaseline='top';g.fillStyle=OUT;g.fillText(text,5,6);g.fillStyle=color;g.fillText(text,3,4);
  const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;return {t,ar:w/h};
}
function makeLabel(text,color='#fff',h=.6){const {t,ar}=labelTex(text,color);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.renderOrder=10;s.scale.set(h*ar,h,1);s.userData={h,text};return s;}
function setLabel(s,text,color='#fff'){if(s.userData.text===text)return;const {t,ar}=labelTex(text,color);s.material.map.dispose();s.material.map=t;s.material.needsUpdate=true;s.scale.set(s.userData.h*ar,s.userData.h,1);s.userData.text=text;}
function baseScene(sky,near,far){
  const s=new THREE.Scene();s.background=new THREE.Color(sky);s.fog=new THREE.Fog(sky,near,far);
  s.add(new THREE.HemisphereLight(0xe8f4ff,0x3a6b2a,.8));const d=new THREE.DirectionalLight(0xffffff,.7);d.position.set(6,12,8);s.add(d);return s;
}
function pixTex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;}
function grass(size,vertical){
  const t=pixTex(vertical?2:1,vertical?1:2,g=>{g.fillStyle='#45a045';g.fillRect(0,0,1,1);g.fillStyle='#3d933d';vertical?g.fillRect(1,0,1,1):g.fillRect(0,1,1,1);},vertical?size/8:1,vertical?1:size/8);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size),new THREE.MeshLambertMaterial({map:t}));m.rotation.x=-Math.PI/2;return m;
}
const CROWD=['#ffd23f','#ff4d5e','#ffffff','#4dc3ff','#ff9f43','#a29bfe','#55efc4','#f1c08f'];
const crowdTex=(rx,ry)=>pixTex(64,16,g=>{g.fillStyle='#2b3f86';g.fillRect(0,0,64,16);for(let y=0;y<16;y+=2)for(let x=(y/2)%2;x<64;x+=2){g.fillStyle=CROWD[Math.floor(Math.random()*CROWD.length)];g.fillRect(x,y,1,1);}},rx,ry);
const adTex=rx=>pixTex(8,1,g=>{g.fillStyle='#ffd23f';g.fillRect(0,0,4,1);g.fillStyle='#ff4d5e';g.fillRect(4,0,4,1);},rx,1);
function blob(r){const m=new THREE.Mesh(new THREE.CircleGeometry(r,12),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.25,depthWrite:false}));m.rotation.x=-Math.PI/2;return m;}

/* skeleton maths (2D, sagittal plane) + keyframed poses, shared by both events */
const SK={T:.55,UA:.3,FA:.28,TH:.45,SH:.45,HEAD:.13,NECK:.07};
function armVec(a,ar,el){const u=a+Math.PI+ar*D2R,f=u+el*D2R;return [Math.cos(u)*SK.UA+Math.cos(f)*SK.FA,Math.sin(u)*SK.UA+Math.sin(f)*SK.FA];}
function solve(hip,a,P){
  const d=[Math.cos(a),Math.sin(a)],sh=[hip[0]+d[0]*SK.T,hip[1]+d[1]*SK.T],base=a+Math.PI;
  const leg=(th,kn)=>{const t=base+th*D2R,sa=t-kn*D2R,k=[hip[0]+Math.cos(t)*SK.TH,hip[1]+Math.sin(t)*SK.TH],ft=[k[0]+Math.cos(sa)*SK.SH,k[1]+Math.sin(sa)*SK.SH],toe=[ft[0]+Math.cos(sa+Math.PI/2)*.15,ft[1]+Math.sin(sa+Math.PI/2)*.15];return [hip,k,ft,toe];};
  const arm=(ar,el)=>{const u=base+ar*D2R,f=u+el*D2R,e=[sh[0]+Math.cos(u)*SK.UA,sh[1]+Math.sin(u)*SK.UA];return [sh,e,[e[0]+Math.cos(f)*SK.FA,e[1]+Math.sin(f)*SK.FA]];};
  return {hip,sh,a,d,P,l1:leg(P.th1,P.kn1),l2:leg(P.th2,P.kn2),a1:arm(P.ar1,P.el1),a2:arm(P.ar2,P.el2)};
}
function grounded(f){const m=Math.min(f.l1[2][1],f.l1[3][1],f.l2[2][1],f.l2[3][1]);return solve([f.hip[0],f.hip[1]-m],f.a,f.P);}

/* low-poly athlete rig: obj (position/yaw) > body (torso tilt) > joints */
function makeAthlete(shirt='#e63946'){
  const obj=new THREE.Group(),body=new THREE.Group();obj.add(body);
  const box=(w,h,d,c,tx,ty,par)=>{const g=new THREE.BoxGeometry(w,h,d);g.translate(tx||0,ty||0,0);return mesh(g,c,0,0,0,par);};
  box(.22,SK.T,.36,shirt,0,SK.T/2,body);
  box(.225,SK.T*.85,.07,'#ffffff',0,SK.T*.47,body);
  box(.24,.17,.33,'#1d2b6b',0,0,body);
  const head=mesh(new THREE.IcosahedronGeometry(SK.HEAD,0),'#f1c08f',.01,SK.T+SK.NECK+SK.HEAD,0,body);
  mesh(new THREE.IcosahedronGeometry(SK.HEAD*.95,0),'#4a3020',-.045,.04,0,head);
  mesh(new THREE.BoxGeometry(.08,.08,.08),'#f1c08f',0,SK.T+.02,0,body);
  const legs=[],arms=[];
  for(const s of [1,-1]){
    const hip=new THREE.Group();hip.position.set(0,0,s*.1);body.add(hip);
    box(.15,SK.TH,.15,'#1d2b6b',0,-SK.TH/2,hip);
    const knee=new THREE.Group();knee.position.y=-SK.TH;hip.add(knee);
    box(.11,SK.SH,.11,'#f1c08f',0,-SK.SH/2,knee);
    const foot=box(.24,.08,.12,'#ffffff',.06,-.04,knee);foot.position.y=-SK.SH;
    legs.push({hip,knee});
    const sh=new THREE.Group();sh.position.set(0,SK.T-.05,s*.22);body.add(sh);
    box(.09,SK.UA,.09,'#f1c08f',0,-SK.UA/2,sh);
    const el=new THREE.Group();el.position.y=-SK.UA;sh.add(el);
    box(.08,SK.FA,.08,'#f1c08f',0,-SK.FA/2,el);
    const hand=new THREE.Object3D();hand.position.y=-SK.FA;el.add(hand);
    arms.push({sh,el,hand});
  }
  return {obj,body,head,legs,arms,
    setPose(P,inward=0){
      legs[0].hip.rotation.z=P.th1*D2R;legs[0].knee.rotation.z=-P.kn1*D2R;
      legs[1].hip.rotation.z=P.th2*D2R;legs[1].knee.rotation.z=-P.kn2*D2R;
      arms[0].sh.rotation.set(inward,0,P.ar1*D2R);arms[0].el.rotation.z=P.el1*D2R;
      arms[1].sh.rotation.set(-inward,0,P.ar2*D2R);arms[1].el.rotation.z=P.el2*D2R;
    }};
}

/* ================= HAMMER ================= */
function makeHammer(){
  const CIRCLE_R=1.07, HAMMER_R=1.75;
  const W_MIN=2.2, W_MAX=8.0, ACCEL=1.6, MAX_TURNS=6;
  const WINDOW=30*D2R, PERFECT=6*D2R, SECTOR=17.46*D2R;
  const MEDALS=[{n:'Kulta',d:70,c:'#ffd23f',e:'🥇'},{n:'Hopea',d:55,c:'#dfe6ee',e:'🥈'},{n:'Pronssi',d:40,c:'#e08a4a',e:'🥉'}];
  const HINT='Paina ja pidä pohjassa (tai välilyönti) pyöriäksesi';
  let state='idle', attempt=0, results=[], parts=[];
  let theta=Math.PI/2, omega=0, spun=0, stateT=0, lastZone=false, dizzy=false, lastS=0, fl=null, hintTimer=0;
  let built=false, scene, cam, A, ball, wire, wireGeo, ballShadow, athShadow, zoneMat, zoneG, letGo, marksG, recArc, recShown=-1, dust=[], stars=[];
  const camPos=new V3(), camTgt=new V3(), tPos=new V3(), tTgt=new V3(), h1=new V3(), h2=new V3(), bpos=new V3(), tmp=new V3();
  const ballAt=th=>bpos.set(Math.cos(th)*HAMMER_R,1.0-.6*Math.sin(th),Math.sin(th)*HAMMER_R);
  function build(){
    built=true;scene=baseScene('#8fd0ff',45,190);
    cam=new THREE.PerspectiveCamera(50,aspect(),.1,500);cams.push(cam);
    const g=grass(500);scene.add(g);

    for(const z of [1.2,-2.6])mesh(new THREE.CylinderGeometry(.06,.06,3.2,6),'#dfe6ee',FIN,1.6,z,scene);
    mesh(new THREE.BoxGeometry(.1,.6,4),'#13204a',FIN,3.1,-.7,scene);

  function top(){hudTop(`${fi(clock,2)} s`,`Aidat ${passed}/10`);}
  function figFor(px,pv,ph,airObj,stumT,isSet){

      if(airObj){baseY=grounded(solve([px,1],a,P)).hip[1];const u=clamp((px-airObj.x0)/JL,0,1),w=Math.min(1,Math.sin(Math.PI*u)*1.7);P=lerpPose(P,HURD,w);a=lerp(a,62*D2R,w);lift=.55*Math.sin(Math.PI*u);}

  }
  const E={
    key:'hurdles',name:'110 m aidat',icon:'🏃',medals:MEDALS,lower:true,fmt:v=>fi(v,2)+' s',
    howto:`<li><span>🔫</span><span>Odota <b>HEP!</b>-merkkiä ja napauta sitten. Liian aikaisin on varaslähtö.</span></li>

    press(){

        const list=`<div>Aika ${fi(finT,2)} s</div><div>Reaktio ${fi(react,2)} s</div><div class="${hits?'f':'o'}">Osumat aitoihin: ${hits}</div><div>${finT<rFin?'<span class="o">Voitit sinisen juoksijan!</span>':'Sininen juoksija: '+fi(rFin,2)+' s'}</div>`;
        finishRound(finT,list);}
    },
    release(){},
    update(dt){
      stT+=dt;
      if(st==='marks'&&stT>1.4){st='set';stT=0;setT=1+Math.random()*1.2;showBanner('Valmiit…','','',' ');}
      else if(st==='set'&&stT>setT){st='go';stT=0;clock=0;showBanner('HEP!','','','good');noise(.25,.35,1800,.002);tone(880,.15,'square',.05);}
      else if(st==='false'&&stT>1.6){resetRace();marks();}
      if(st==='go'&&stT>.8&&banner.classList.contains('show')&&$('b1').textContent==='HEP!')hideBanner();
      if(st==='go'||st==='finished'||st==='done'){
        if(st==='go')clock+=dt;rc+=dt;
        if(rc>RIVAL_REACT){rv=Math.min(RIVAL_V,rv+ACC*dt);rx+=rv*dt;rph+=rv*dt*1.9;}
        if(!rFin&&rx>=FIN)rFin=rc;
        if(rx>FIN+3)rv*=Math.exp(-dt*2);

      if(st==='go'&&started){
        v=Math.min(VMAX,v+ACC*dt*(stum>0?.3:1));x+=v*dt;legPh+=v*dt*1.9;stum=Math.max(0,stum-dt);

        if(air&&(x-air.x0)/JL>=1){air=null;sfx.step();}

        v*=Math.exp(-dt*1.5);x+=v*dt;legPh+=v*dt*1.9;air=null;
        if(st==='finished'&&stT>1.2){st='done';stT=0;
          const med=MEDALS.find(m=>finT<=m.d),won=!rFin||finT<rFin;
          const lines=[won?'Voitit sinisen juoksijan!':'Sininen juoksija voitti.'];

          showBanner(`${fi(finT,2)} s`,(med?`${med.e} ${med.n}tulos!\n`:'')+lines.slice(0,2).join('\n'),'Napauta: tulokset',won?'good':'');

      const cx=st==='idle'?x+2.5:Math.min(FIN+2,x+2.5+(st==='go'&&started?v/5:0));
      sideCam(tPos,tTgt,7.5,3.4,1.1,cx);const k=1-Math.exp(-dt*5);camPos.lerp(tPos,k);camTgt.lerp(tTgt,k);

      const g=new THREE.Group();g.position.set(x,TY,TZ);scene.add(g);
      mesh(new THREE.BoxGeometry(1.4,1.4,.3),'#d9c27a',0,0,0,g);
      for(const lx of [-.5,.5]){const l=mesh(new THREE.BoxGeometry(.08,1.9,.08),'#8a6a40',lx,-.55,.25,g);l.rotation.x=-.25;}
      const b=mesh(new THREE.BoxGeometry(.08,1.9,.08),'#8a6a40',0,-.5,-.5,g);b.rotation.x=.35;
      const fm=new THREE.Mesh(new THREE.PlaneGeometry(TR*2,TR*2),faceMat());fm.position.z=.17;g.add(fm);
      if(!real){mesh(new THREE.BoxGeometry(.4,.25,.02),'#ffffff',0,.85,.1,g);}
      return g;};
    face(0,true);for(const x of [-4,4,-8,8])face(x,false);
    stuckG=new THREE.Group();scene.add(stuckG);
    A=makeAthlete('#2f6fd6');scene.add(A.obj);
    bowG=new THREE.Group();scene.add(bowG);
    const t=new THREE.Mesh(new THREE.TorusGeometry(.7,.02,4,14,2.2),mat('#7a4a22'));t.position.set(-.7,0,0);t.rotation.z=-1.1;bowG.add(t);
    mesh(new THREE.BoxGeometry(.05,.14,.05),'#1a1a2e',0,0,0,bowG);
    strGeo=new THREE.BufferGeometry().setFromPoints([new V3(),new V3(),new V3()]);scene.add(new THREE.Line(strGeo,new THREE.LineBasicMaterial({color:'#ffffff'})));
    nocked=makeArrow();scene.add(nocked);
    flyArrow=makeArrow();flyArrow.visible=false;scene.add(flyArrow);
    crossG=new THREE.Group();scene.add(crossG);crossMat=new THREE.MeshBasicMaterial({color:'#ffffff',depthTest:false,transparent:true});
    const outl=new THREE.MeshBasicMaterial({color:'#1a1a2e',depthTest:false,transparent:true});
    const add=(g,m,o)=>{const x=new THREE.Mesh(g,m);x.renderOrder=o;crossG.add(x);return x;};
    add(new THREE.RingGeometry(.045,.075,24),outl,20);add(new THREE.RingGeometry(.052,.068,24),crossMat,21);
    for(const [w,h] of [[.2,.024],[.024,.2]]){add(new THREE.PlaneGeometry(w,h),outl,20);}
    for(const [w,h] of [[.18,.01],[.01,.18]]){add(new THREE.PlaneGeometry(w,h),crossMat,21);}
    popLabel=makeLabel('10','#ffd23f',.22);popLabel.visible=false;scene.add(popLabel);
  }
  // swing back and forth through the centre; swing direction slowly rotates; small jitter keeps it from being exact
  function newWob(){const r=()=>Math.random(),sp=1+shot*.07;wob={w:(2.0+r()*.4)*sp,rot:(r()<.5?-1:1)*(.45+r()*.35),ph:r()*TAU,a0:r()*TAU,j1:(4.1+r())*sp,j2:(4.9+r())*sp,jp:r()*TAU};}
  function aimAt(t){const tire=1+Math.max(0,t-7)*.3,A0=AMP*(1+shot*.05)*tire,w=wob;
    const s=Math.sin(w.w*t+w.ph),dir=w.a0+w.rot*t,jx=.1*Math.sin(w.j1*t+w.jp),jy=.1*Math.sin(w.j2*t+w.jp*1.7);
    return [A0*(s*Math.cos(dir)+jx),A0*(s*Math.sin(dir)+jy)];}
  const ringOf=d=>d>TR?0:10-Math.floor(d/RW);
  function top(){hudTop(`Nuoli ${Math.min(shot+1,N)}/${N}`,`Pisteet ${total}`);hudPips(shot);}
  function aimView(){const h=Math.max(1.75/aspect(),1.75);tFov=2*Math.atan(h/2/(DIST+.3))*R2D;tPos.set(0,TY+.05,.3);tTgt.set(0,TY,TZ);}
  function wideView(){tFov=55;tPos.set(.55,2.0,5.0);tTgt.set(-.3,1.0,-10);}
  function startAim(){st='aim';stT=0;aimT=0;newWob();setHint('Napauta, kun tähtäin on keltaisella!');hideBanner();}
  function shoot(){
    st='fly';stT=0;const d=Math.hypot(ax,ay);
    fly={t:0,T:.38,x:ax,y:ay,score:ringOf(d),X:d<=RW*.5,boss:Math.abs(ax)<.7&&Math.abs(ay)<.7};
    flyArrow.visible=true;setHint('');
    tone(220,.12,'triangle',.1,0,110);noise(.12,.12,2500,.003);
  }
  function hit(){
    flyArrow.visible=false;const f=fly;st='hit';stT=0;
    scores.push({s:f.score,X:f.X&&f.score===10});total+=f.score;shot++;
    if(f.boss){const a=makeArrow();a.position.set(f.x,TY+f.y,TZ+.15+.3);a.rotation.set((Math.random()-.5)*.12,(Math.random()-.5)*.12,0);stuckG.add(a);
      tone(140,.12,'square',.08,0,70);noise(.08,.15,600,.003);}
    const txt=f.score===0?'Ohi':(f.X&&f.score===10?'X!':String(f.score));
    setLabel(popLabel,txt,f.score>=9?'#ffd23f':f.score===0?'#ff4d5e':'#ffffff');pop={t:0,x:f.x,y:f.y};popLabel.visible=true;
    if(f.score>=9)tone(f.score===10?1568:1175,.18,'square',.05,.05);
    if(f.score===0)sfx.buzz();
    top();
    if(shot<N)setHint(`${f.score===0?'Ohi':f.score+' pistettä'}! Napauta: seuraava nuoli`);
    else setHint('');
  }
  function finish(){
    st='done';stT=0;const med=MEDALS.find(m=>total>=m.d),tens=scores.filter(s=>s.s===10).length;
    const lines=[med?`${med.e} ${med.n}!`:'Keep practising!',tens?`${tens} ${tens>1?'nuolta':'nuoli'} kymppiin`:'Odota, että tähtäin osuu keskelle'];
    showBanner(`${total} pistettä`,lines.join('\n'),'Napauta: tulokset',med?'good':'');if(med)sfx.fanfare();else sfx.cheer(.4);
  }
  const E={
    key:'archery',name:'Jousiammunta',icon:'🏹',medals:MEDALS,fmt:v=>v+' pistettä',
    howto:`<li><span>👆</span><span><b>Napauta</b>, niin jännität jousen.</span></li>
      <li><span>🎯</span><span>Tähtäin heiluu taulun päällä. Seuraa, miten se liikkuu.</span></li>
      <li><span>🟡</span><span><b>Napauta</b>, kun tähtäin muuttuu keltaiseksi taulun keskellä. Keskusta on 10 pistettä.</span></li>
      <li><span>💪</span><span>Älä odota liian kauan. Käsi väsyy ja tähtäin heiluu enemmän.</span></li>`,
    goals:'🥉&nbsp;40 &nbsp; 🥈&nbsp;48 &nbsp; 🥇&nbsp;54&nbsp;pistettä',rule:'6 nuolta. Täydellinen tulos on 60 pistettä.',
    idle(){if(!built)build();st='idle';drawK=0;stuckG.clear();wideView();camPos.copy(tPos);camTgt.copy(tTgt);fov=tFov;},
    start(){shot=0;scores=[];total=0;stuckG.clear();drawK=0;popLabel.visible=false;hudSetup('Käsi','Nuolet',N);st='ready';stT=0;top();hudBar(1);setHint('Napauta (tai välilyönti) jännittääksesi jousen');wideView();camPos.copy(tPos);camTgt.copy(tTgt);fov=tFov;},
    press(){
      if(st==='ready'){st='draw';stT=0;setHint('');tone(180,.5,'sawtooth',.03,0,260);}
      else if(st==='aim'&&aimT>.25)shoot();
      else if(st==='hit'&&stT>.4&&shot<N){popLabel.visible=false;startAim();}
      else if(st==='done'&&stT>.6){hideBanner();finishRound(total,`<div>${scores.map(s=>s.s===0?'<span class="f">O</span>':s.X?'<span class="o">X</span>':s.s).join(' &nbsp;')}</div><div>Yhteensä ${total}/60</div>`);}
    },
    release(){},
    update(dt){
      stT+=dt;
      if(st==='draw'){drawK=Math.min(1,stT/.5);if(stT>.9)startAim();}
      if(st==='aim'){aimT+=dt;[ax,ay]=aimAt(aimT);hudBar(1-Math.min(1,aimT/7));}
      if(st==='fly'){fly.t+=dt;if(fly.t>=fly.T)hit();}
      if(st==='hit'&&shot>=N&&stT>1)finish();
      if(pop){pop.t+=dt;popLabel.position.set(pop.x,TY+pop.y+.12+pop.t*.15,TZ+.4);popLabel.material.opacity=Math.max(0,1-Math.max(0,pop.t-1.2));}
      if(st==='idle'||st==='ready')wideView();else if(st==='draw'&&stT<.35)wideView();else aimView();
      const k=1-Math.exp(-dt*(st==='draw'?3.5:4));camPos.lerp(tPos,k);camTgt.lerp(tTgt,k);fov+=(tFov-fov)*k;
    },
    draw(){
      const P=lerpPose(RELAX,DRAWN,ease(drawK));
      const f=grounded(solve([0,1],Math.PI/2,P));
      A.obj.position.set(-.45,f.hip[1]+.07,.45);A.obj.rotation.y=Math.PI/2;A.body.rotation.z=0;A.setPose(P,.28*drawK);
      A.obj.updateMatrixWorld(true);
      A.arms[1].hand.getWorldPosition(v1);A.arms[0].hand.getWorldPosition(v2);
      bowG.position.copy(v1);bowG.rotation.set(0,Math.PI/2,(1-drawK)*.9);bowG.updateMatrixWorld(true);
      const tip1=bowG.localToWorld(v3.set(-.38,.62,0)).clone(),tip2=bowG.localToWorld(v3.set(-.38,-.62,0)).clone();
      const mid=drawK>.3?v2:tip1.clone().add(tip2).multiplyScalar(.5);
      const pos=strGeo.attributes.position;pos.setXYZ(0,tip1.x,tip1.y,tip1.z);pos.setXYZ(1,mid.x,mid.y,mid.z);pos.setXYZ(2,tip2.x,tip2.y,tip2.z);pos.needsUpdate=true;strGeo.computeBoundingSphere();
      nocked.visible=drawK>.5&&(st==='draw'||st==='aim');
      if(nocked.visible){nocked.position.copy(v1).add(v2).multiplyScalar(.5);nocked.lookAt(v2);}
      if(st==='fly'){const u=fly.t/fly.T;flyArrow.position.set(lerp(.05,fly.x,u),lerp(TY-.05,TY+fly.y,u)+Math.sin(Math.PI*u)*.08,lerp(-4,TZ+.45,u));flyArrow.rotation.set(0,0,0);}
      crossG.visible=st==='aim';
      if(crossG.visible){crossG.position.set(ax,TY+ay,TZ+.25);crossMat.color.set(Math.hypot(ax,ay)<=RW*2?'#ffd23f':'#ffffff');}
      cam.fov=fov;cam.updateProjectionMatrix();cam.position.copy(camPos);cam.lookAt(camTgt);renderer.render(scene,cam);
    }
  };
  return E;
}

/* ================= APP ================= */
const EVENTS={hammer:makeHammer(),javelin:makeJavelin(),vault:makeVault(),hurdles:makeHurdles(),archery:makeArchery()};
let EV=null, app='menu';
function showMenu(){
  app='menu';hud.className='off';setHint('');hideBanner();
  card.innerHTML=`<h1>Kesän<br>urheilupäivä</h1><div class="btns">
    ${Object.values(EVENTS).map(e=>`<button class="ev" data-k="${e.key}"><span class="ic">${e.icon}</span><span>${e.name}<small>${rec[e.key]?'Ennätys '+e.fmt(rec[e.key]):'Ei vielä ennätystä'}</small></span></button>`).join('')}</div>`;
  overlay.className='show';
  card.querySelectorAll('.ev').forEach(b=>b.onclick=()=>{initAudio();showIntro(b.dataset.k);});
  card.querySelector('.ev').focus();
}
function showIntro(k){
  app='intro';EV=EVENTS[k];EV.idle();
  card.innerHTML=`<h1>${EV.name.replace(/ (?=[^ ]+$)/,'<br>')}</h1><ul class="steps">${EV.howto}</ul>
    <p class="goals">${EV.goals}</p><p class="rec">${rec[k]?`Ennätyksesi: ${EV.fmt(rec[k])}`:EV.rule}</p>
    <div class="btns"><button id="go">Aloita</button><button class="ghost" id="back">Kaikki lajit</button></div>`;
  overlay.className='show';$('go').onclick=startRound;$('back').onclick=showMenu;$('go').focus();
}
function startRound(){initAudio();overlay.className='';hud.className='';app='play';EV.start();}
function finishRound(best,list){
  app='results';setHint('');
  const lo=!!EV.lower, med=EV.medals.find(m=>lo?best<=m.d:best>=m.d), isRec=lo?(best>0&&(!rec[EV.key]||best<rec[EV.key])):best>rec[EV.key];
  if(isRec){rec[EV.key]=best;saveRec();}
  card.innerHTML=`<div class="medal">${med?med.e:'🏃'}</div><h2>${med?med.n+'!':'Harjoittele lisää!'}</h2>
    <div class="list">${list}</div>
    <p class="rec">${isRec?'Uusi ennätys! ':''}Ennätys: ${rec[EV.key]?EV.fmt(rec[EV.key]):'-'}</p>
    <div class="btns"><button id="again">Pelaa uudelleen</button><button class="ghost" id="menu">Kaikki lajit</button></div>`;
  overlay.className='show';$('again').onclick=startRound;$('menu').onclick=()=>{EV.idle();showMenu();};$('again').focus();
  if(med)sfx.fanfare();
}
const blocked=e=>e.target.closest&&e.target.closest('#overlay,#quit');
const quitBtn=$('quit');let quitTimer=0;
function resetQuit(){clearTimeout(quitTimer);quitBtn.classList.remove('confirm');quitBtn.textContent='Valikko';}
function quitToMenu(){resetQuit();hideBanner();setHint('');EV.idle();showMenu();}
quitBtn.addEventListener('click',e=>{
  e.stopPropagation();if(app!=='play')return;initAudio();
  if(quitBtn.classList.contains('confirm'))quitToMenu();
  else{quitBtn.classList.add('confirm');quitBtn.textContent='Lopeta?';tone(440,.06,'square',.04);quitTimer=setTimeout(resetQuit,2500);}
});
window.addEventListener('keydown',e=>{if(e.code==='Escape'&&app==='play'){e.preventDefault();quitToMenu();}});
window.addEventListener('pointerdown',e=>{if(blocked(e)||app!=='play')return;e.preventDefault();initAudio();EV.press();});
window.addEventListener('pointerup',e=>{if(blocked(e)||app!=='play')return;EV.release();});
window.addEventListener('pointercancel',()=>{if(app==='play')EV.release();});
window.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||app!=='play')return;e.preventDefault();EV.press();});
window.addEventListener('keyup',e=>{if(e.code==='Space'&&app==='play')EV.release();});
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;EV.update(dt);EV.draw();requestAnimationFrame(loop);}
resize();EV=EVENTS.hammer;EV.idle();showMenu();requestAnimationFrame(loop);
})();
}
(document.fonts&&document.fonts.load?Promise.race([document.fonts.load('16px "Press Start 2P"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(boot,boot);
</script>
