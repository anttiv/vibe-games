<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelihylly</title>
<meta name="description" content="Pieniä selainpelejä lapsille. Ei mainoksia, ei latauksia.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
<style>
:root{
  --ink:#2B1B5A; --sky:#CDEBFF; --sky2:#E9F6FF; --panel:#FFFFFF; --muted:#5E5390;
  --wood:#C98A4B; --wood-dark:#9A6230;
  --sun:#FFC83D; --pink:#FF6FA8; --mint:#3FD6B0; --blue:#7FA6FF; --red:#FF7A6B;
  --edge:#2B1B5A;
  --row:310px; --gap:58px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#FFF4CC; --sky:#1B2250; --sky2:#252C66; --panel:#2A2160; --muted:#C9BEF5; --edge:#0E0A2B; --wood:#A8703B; --wood-dark:#6E4520; color-scheme:dark; }
}
:root[data-theme="dark"]{ --ink:#FFF4CC; --sky:#1B2250; --sky2:#252C66; --panel:#2A2160; --muted:#C9BEF5; --edge:#0E0A2B; --wood:#A8703B; --wood-dark:#6E4520; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; color:var(--ink);
  background:linear-gradient(180deg, var(--sky) 0, var(--sky2) 520px, var(--sky2) 100%);
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Varela Round",system-ui,sans-serif;
  line-height:1.45;
}
.wrap{max-width:1080px; margin:0 auto; padding:clamp(24px,5vw,56px) clamp(16px,4vw,32px) 40px}

/* title: letters as toy blocks */
header{margin-bottom:clamp(28px,5vw,48px)}
h1{
  margin:0 0 18px; display:flex; flex-wrap:wrap; gap:.12em;
  font-size:clamp(26px,7.2vw,68px); font-weight:900; line-height:1;
}
h1 .b{
  display:grid; place-items:center; width:1.18em; height:1.18em;
  background:var(--c); color:#2B1B5A; border:4px solid var(--edge); border-radius:.22em;
  box-shadow:0 .1em 0 var(--edge); transform:rotate(var(--r));
}
h1 .b:nth-child(4n+1){--c:var(--sun); --r:-4deg}
h1 .b:nth-child(4n+2){--c:var(--pink); --r:3deg}
h1 .b:nth-child(4n+3){--c:var(--mint); --r:-2deg}
h1 .b:nth-child(4n+4){--c:var(--blue); --r:4deg}
@media (prefers-reduced-motion: no-preference){
  h1 .b{animation:drop .55s cubic-bezier(.3,1.5,.5,1) both; animation-delay:calc(var(--i) * 60ms)}
  @keyframes drop{from{transform:translateY(-60px) rotate(0deg); opacity:0}}
}
.intro{margin:0; max-width:34em; font-size:clamp(1.05rem,2.6vw,1.25rem); color:var(--muted); font-weight:600}

/* shelf: planks drawn behind each grid row */
.shelf{
  list-style:none; margin:0; padding:0;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  grid-auto-rows:var(--row); column-gap:clamp(16px,3vw,28px); row-gap:var(--gap);
  background-image:linear-gradient(to bottom,
    transparent 0 calc(var(--row) + 9px),
    var(--edge) calc(var(--row) + 9px) calc(var(--row) + 12px),
    var(--wood) calc(var(--row) + 12px) calc(var(--row) + 26px),
    var(--wood-dark) calc(var(--row) + 26px) calc(var(--row) + 31px),
    var(--edge) calc(var(--row) + 31px) calc(var(--row) + 34px),
    transparent calc(var(--row) + 34px));
  background-size:100% calc(var(--row) + var(--gap));
  padding-bottom:calc(var(--gap) - 20px);
  margin-inline:calc(clamp(16px,4vw,32px) * -.5); padding-inline:calc(clamp(16px,4vw,32px) * .5);
}
.tile{height:100%}
.tile a, .tile .soon{
  height:100%; display:flex; flex-direction:column; text-decoration:none; color:var(--ink);
  background:var(--panel); border:4px solid var(--edge); border-radius:22px; overflow:hidden;
  box-shadow:0 7px 0 var(--edge); position:relative;
  transition:transform .12s ease, box-shadow .12s ease;
}
.tile a:hover{transform:translateY(-3px); box-shadow:0 10px 0 var(--edge)}
.tile a:active{transform:translateY(5px); box-shadow:0 2px 0 var(--edge)}
.tile a:focus-visible{outline:5px solid var(--pink); outline-offset:5px}
.art{
  flex:0 0 46%; display:grid; place-items:center; border-bottom:4px solid var(--edge);
  background:var(--c, var(--sun)); position:relative; overflow:hidden;
}
.art img{width:100%; height:100%; object-fit:cover; display:block}
.art .emoji{font-size:clamp(64px,9vw,84px); line-height:1; filter:drop-shadow(0 4px 0 rgba(43,27,90,.25))}
.art::after{ /* sparkle dots, subtle texture */
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.55) 1.5px, transparent 2px);
  background-size:22px 22px; background-position:6px 8px; opacity:.6;
}
.body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
.body h2{margin:0; font-size:1.3rem; line-height:1.15; font-weight:900}
.body p{margin:0; font-size:.98rem; color:var(--muted); font-weight:600}
.facts{margin-top:auto; display:flex; flex-wrap:wrap; gap:6px; padding:0; list-style:none}
.facts li{font-size:.85rem; font-weight:800; padding:2px 10px; border-radius:999px; border:2px solid var(--edge); background:var(--sky2)}
.sticker{
  position:absolute; top:12px; right:-6px; z-index:1;
  background:var(--red); color:#fff; font-weight:900; font-size:.95rem; padding:4px 14px 4px 12px;
  border:3px solid var(--edge); border-radius:10px 0 0 10px; transform:rotate(4deg);
}
.tile .soon{background:transparent; border-style:dashed; border-color:var(--muted); box-shadow:none; align-items:center; justify-content:center; text-align:center; padding:20px; gap:8px; color:var(--muted)}
.tile .soon .emoji{font-size:56px; opacity:.6}
.tile .soon strong{font-size:1.15rem; color:var(--ink)}

footer{margin-top:28px; max-width:40em; color:var(--muted); font-size:.95rem; font-weight:600}
footer p{margin:.4em 0}

@media (max-width:560px){
  :root{--row:290px; --gap:52px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title" aria-label="Pelihylly"></h1>
    <p class="intro" id="intro"></p>
  </header>

  <main>
    <ul class="shelf" id="shelf" aria-label="Pelit"></ul>
  </main>

  <footer id="footer"></footer>
</div>

<script>
/* =========================================================
   EDIT HERE: site text and the list of games.
   Each game lives in its own folder next to this file, e.g.
     /index.html                ← this page
     /rakettiretki/index.html   ← the rocket game
   ========================================================= */
const SITE = {
  title: 'Pelihylly',
  intro: 'Pieniä selainpelejä lapsille. Napauta peliä ja pelaa heti, ilman latauksia ja mainoksia.',
  footer: [
    'Pelit on tehty tekoälyn avulla. Ne eivät kerää tietoja, eivät tarvitse tiliä eivätkä näytä mainoksia.',
    'Toimii parhaiten tabletilla tai puhelimella.'
  ]
};

const GAMES = [
  {
    title: 'Pikku rakettiretki',
    url: 'rakettiretki/',
    emoji: '🚀',            // shown if no image
    image: '',              // optional: e.g. 'rakettiretki/kansikuva.png'
    color: '#7FC8FF',       // background of the picture area
    desc: 'Rakenna raketti, lennä planeetalle ja korjaa vikoja matkalla.',
    age: '4–7 v',
    minutes: 10,
    isNew: true
  },
  // Copy the block above for each new game.
  { soon: true }
];

/* ---------- rendering (no need to edit) ---------- */
const $ = s => document.querySelector(s);
document.title = SITE.title;
$('#title').setAttribute('aria-label', SITE.title);
$('#title').innerHTML = [...SITE.title].map((ch, i) =>
  ch === ' ' ? '<span style="width:.3em"></span>' : `<span class="b" style="--i:${i}" aria-hidden="true">${ch}</span>`).join('');
$('#intro').textContent = SITE.intro;
$('#footer').innerHTML = SITE.footer.map(t => `<p>${t}</p>`).join('');

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#shelf').innerHTML = GAMES.map(g => {
  if (g.soon) return `<li class="tile"><div class="soon"><span class="emoji" aria-hidden="true">🧩</span><strong>Uusi peli tulossa</strong><span>Hyllyssä on tilaa.</span></div></li>`;
  const art = g.image ? `<img src="${esc(g.image)}" alt="">` : `<span class="emoji" aria-hidden="true">${esc(g.emoji)}</span>`;
  const facts = [g.age && `<li>${esc(g.age)}</li>`, g.minutes && `<li>noin ${esc(g.minutes)} min</li>`].filter(Boolean).join('');
  return `<li class="tile"><a href="${esc(g.url)}">
    ${g.isNew ? '<span class="sticker">Uusi!</span>' : ''}
    <div class="art" style="--c:${esc(g.color || '#FFC83D')}">${art}</div>
    <div class="body"><h2>${esc(g.title)}</h2><p>${esc(g.desc)}</p>${facts ? `<ul class="facts" aria-label="Tietoja">${facts}</ul>` : ''}</div>
  </a></li>`;
}).join('');
</script>
</body>
</html>
